<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<title>Navigator Studio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, Avenir, Helvetica, Arial, sans-serif;
  }

  .splash-card {
    width: calc(100% - 24px);
    height: calc(100% - 24px);
    margin: 12px;
    border-radius: 14px;
    background: linear-gradient(160deg, #1a1a1a 0%, #121212 55%, #1d0f17 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    -webkit-app-region: drag;
  }

  .splash-logo {
    width: 72px;
    height: 72px;
    filter: drop-shadow(0 4px 10px rgba(101, 43, 82, 0.55));
    animation: splash-pop 0.5s ease-out;
  }

  .splash-title {
    margin: 0;
    color: #ffffff;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .splash-subtitle {
    margin: -12px 0 0;
    color: #b5b5b5;
    font-size: 12px;
  }

  .splash-progress {
    width: 150px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  .splash-progress-bar {
    width: 40%;
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #652b52, #e0498f);
    animation: splash-sweep 1.1s ease-in-out infinite;
  }

  @keyframes splash-sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  @keyframes splash-pop {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="splash-card">
    <img class="splash-logo" src="./balazslogo.svg" alt="Navigator Studio" />
    <h1 class="splash-title">Navigator Studio</h1>
    <p class="splash-subtitle">Betöltés...</p>
    <div class="splash-progress"><div class="splash-progress-bar"></div></div>
  </div>
</body>
</html>
